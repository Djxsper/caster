name: Build a test IPA

# A personal build for testing on your own device, before any of it is real.
#
# Deliberately NOT a GitHub Release: this is a Debug build carrying the fake
# interstitial, the "pretend Plus is bought" switch and the TEST BUILD badge, and
# none of that belongs on the public downloads page. It is published as a run
# artifact instead, which only you can reach.
#
# `release.yml` remains the public path and builds Release, where every one of
# those affordances compiles out.
#
#   Actions -> Build a test IPA -> Run workflow
#
# The IPA is unsigned, exactly like the public one — AltStore / SideStore re-sign
# it with your own Apple ID at install time.
#
# It shares the bundle id com.jesperhaafkes.Caster, so installing it REPLACES a
# normal Caster and inherits its saved wheels and groups. That is useful for
# testing the grandfather clause; it also means your real data is what you are
# experimenting on.

on:
  # The manual button needs this file to exist on the default branch, and master
  # is a long way behind the branch the work is actually on — it does not even
  # have android.yml. Until that catches up, touching this file is the trigger.
  #
  # The paths filter is what keeps that from being wasteful: an ordinary commit
  # does not book a macOS runner, only a deliberate edit to this workflow does.
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ipa.yml"

jobs:
  test-ipa:
    name: Build an unsigned Debug IPA for a device
    runs-on: macos-15
    timeout-minutes: 40

    env:
      SCHEME: Caster
      PROJECT: Caster.xcodeproj

    steps:
      - uses: actions/checkout@v5

      # The project uses objectVersion 77 (file-system synchronized groups),
      # which needs Xcode 16 or newer to open.
      - name: Select the newest installed Xcode
        run: |
          set -eu
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V 2>/dev/null | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode 16+ required (found $MAJOR)."
            exit 1
          fi

      - name: Build the unsigned Debug device IPA
        run: |
          set -eu
          set -o pipefail
          # Debug, unlike release.yml. That is the entire point of this workflow:
          # everything behind #if DEBUG has to survive into the binary.
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -30

          APP=$(find build-device/Build/Products/Debug-iphoneos -maxdepth 1 -name "Caster.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Caster.app not produced for device"
            find build-device/Build/Products -maxdepth 2 || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "caster-adtest.ipa" Payload
          ls -lh caster-adtest.ipa

      # Uploaded before it is inspected, on purpose. A check that withholds the
      # artifact it was meant to describe is worse than no check.
      - uses: actions/upload-artifact@v6
        with:
          name: caster-adtest
          path: caster-adtest.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Confirm the debug affordances actually made it in
        run: |
          set -u
          BIN=Payload/Caster.app/Caster
          if [ ! -f "$BIN" ]; then
            echo "::error::no executable at $BIN"
            find Payload -maxdepth 3 || true
            exit 1
          fi
          file "$BIN" || true
          ls -lh "$BIN"

          # grep -a rather than strings: Swift stores short literals inline in
          # code (small-string optimisation) instead of in __cstring, so strings
          # misses them even when they are plainly there.
          probe() {
            if grep -aqF "$2" "$BIN"; then
              echo "  present  $1: $2"
            else
              echo "  ABSENT   $1: $2"
              return 1
            fi
          }

          # A control that has nothing to do with DEBUG. If this is absent too
          # then the search is wrong, not the build configuration - which is
          # exactly the distinction the last run could not make.
          CONTROL=0
          probe control "Ready to play" || CONTROL=1

          DEBUGBITS=0
          probe debug "An ad would appear here" || DEBUGBITS=1
          probe debug "Pretend Plus is bought" || DEBUGBITS=1
          probe debug "TEST BUILD" || DEBUGBITS=1

          if [ "$CONTROL" -ne 0 ]; then
            echo "::warning::Even a non-debug string is unreadable this way, so this check cannot tell you anything. The IPA is still uploaded."
          elif [ "$DEBUGBITS" -ne 0 ]; then
            echo "::error::The build is missing its debug affordances - DEBUG is not active in this configuration."
            exit 1
          else
            echo "All debug affordances are in the binary."
          fi

      - name: How to install it
        run: |
          echo "### Test IPA ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download **caster-adtest** from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Unzip it on your iPhone to get \`caster-adtest.ipa\`." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Open it and choose **Share -> AltStore**." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "It replaces any installed Caster and keeps its saved wheels and groups." >> "$GITHUB_STEP_SUMMARY"
          echo "Look for the orange **TEST BUILD** badge on the launch screen, and the" >> "$GITHUB_STEP_SUMMARY"
          echo "**Test build** section at the bottom of Settings." >> "$GITHUB_STEP_SUMMARY"
