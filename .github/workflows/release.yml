name: Publish a release

# Pushing a v* tag builds the device IPA and attaches it to a GitHub Release, so
# there is a stable public download link for sideloaders:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The IPA is unsigned on purpose — AltStore / SideStore re-sign it with the
# installer's own Apple ID, so CI never needs a certificate or a profile.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the IPA
    runs-on: macos-15
    timeout-minutes: 40

    env:
      SCHEME: Caster
      PROJECT: Caster.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: meta
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      # The project uses objectVersion 77 (file-system synchronized groups),
      # which needs Xcode 16 or newer to open.
      - name: Select the newest installed Xcode
        run: |
          set -eu
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V 2>/dev/null | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode 16+ required (found $MAJOR)."
            exit 1
          fi

      - name: Build the unsigned device IPA
        run: |
          set -eu
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -30

          APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name "Caster.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Caster.app not produced for device"
            find build-device/Build/Products -maxdepth 2 || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Caster-${{ steps.meta.outputs.tag }}.ipa" Payload
          ls -lh "Caster-${{ steps.meta.outputs.tag }}.ipa"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          # Written to a file rather than passed inline so the markdown keeps its
          # line breaks and does not fight the shell over quoting.
          cat > release-notes.md <<'NOTES'
          ## Install on iPhone or iPad

          Requires **iOS 17 or newer**.

          This build is **unsigned** — you re-sign it with your own free Apple ID
          when you install it. You need [AltStore](https://altstore.io) or
          [SideStore](https://sidestore.io) set up first.

          1. Download the `.ipa` below on your iPhone.
          2. Open it and choose **Share → AltStore** (or SideStore).
          3. Sign in with your Apple ID when asked, and wait for it to install.

          A free Apple ID signs apps for 7 days at a time and allows three of
          them at once; AltStore and SideStore can refresh automatically over
          Wi-Fi. A paid developer account extends this to a year.

          No Android build exists — see the README for why.
          NOTES

          gh release create "$TAG" \
            "Caster-$TAG.ipa" \
            --title "Caster $TAG" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
